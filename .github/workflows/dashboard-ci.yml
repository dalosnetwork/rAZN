name: Dashboard CI

on:
  pull_request:
    branches:
      - dev
      - main
  push:
    branches:
      - dev
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dashboard-ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: dashboard

env:
  CI: true
  NODE_VERSION: "22"
  PNPM_VERSION: "9.0.0"
  NEXT_TELEMETRY_DISABLED: "1"
  TURBO_TELEMETRY_DISABLED: "1"
  DATABASE_URL: postgresql://dashboard:dashboard@localhost:5432/dashboard
  REDIS_URL: redis://localhost:6379
  BETTER_AUTH_SECRET: ci-only-auth-secret
  BETTER_AUTH_URL: http://localhost:3000
  CORS_ORIGIN: http://localhost:3000
  API_BASE_URL: http://localhost:3002
  NEXT_PUBLIC_API_BASE_URL: http://localhost:3000/api
  NEXT_PUBLIC_BSC_CHAIN_ID: "97"
  NEXT_PUBLIC_BSC_TOKEN_CONTRACT_ADDRESS: "0xb11fc1e75b837e1719565271ba4ba5b6b2e794fe"
  NEXT_PUBLIC_BSC_TOKEN_REDEEM_FUNCTION: burnFrom

jobs:
  dashboard:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: dashboard/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm check-types

      - name: API tests
        run: pnpm --filter api test

      - name: Build
        run: pnpm build
